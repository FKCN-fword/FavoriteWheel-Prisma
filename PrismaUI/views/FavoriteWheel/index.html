<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FavoriteWheel</title>
<style>
/* Design tokens, geometry and sizes copied from the DOM PrismaUI half-ring. */
:root {
  --iron-deep:   rgba(14, 15, 18, 0.88);
  --iron:        rgba(26, 28, 34, 0.82);
  --iron-active: rgba(62, 49, 31, 0.92);
  --iron-off:    rgba(20, 22, 26, 0.55);
  --line:        rgba(140, 128, 108, 0.28);
  --line-strong: rgba(200, 121, 31, 0.72);
  --text:        #ece6d4;
  --text-mute:   #a39c8b;
  --text-dim:    #5e5a52;
  --ember:       #c8791f;
  --sans: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
body { font-family: var(--sans); color: var(--text); user-select: none; -webkit-user-select: none; }
#root { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#vignette {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  background: radial-gradient(circle farthest-corner at 50% 50%,
    rgba(14, 15, 18, 0) 0, rgba(14, 15, 18, 0) calc(100vw / 6), var(--iron-deep) 100%);
}
#stage { position: absolute; }
#halfring { overflow: visible; }

.wedge { fill: var(--iron); stroke: var(--line); stroke-width: 1; }
.wedge.active { fill: var(--iron-active); stroke: var(--line-strong); stroke-width: 1.5; }
.wedge.off { fill: var(--iron-off); }
.wedge-label { fill: var(--text); font-family: var(--sans); font-size: 14px; font-weight: 600; text-anchor: middle;
  dominant-baseline: middle; letter-spacing: 0.015em; }
.wedge-label.left { text-anchor: start; }
.wedge-label.muted { fill: var(--text-dim); font-weight: 500; }
.wedge-label.active { fill: var(--ember); }
.icon { color: var(--text); }
.icon.muted { color: var(--text-dim); }
.icon.active { color: var(--ember); }
.icon path, .icon circle, .icon rect {
  fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
}
.h-centerline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-linecap: round; opacity: 0.5; }
.badge { fill: var(--iron-deep); stroke: var(--line-strong); stroke-width: 1; }
.count { fill: var(--text-mute); font-family: var(--sans); font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
.count.active { fill: var(--ember); }
.badge-n { fill: var(--ember); font-family: var(--sans); font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
.title { fill: var(--ember); font-family: var(--sans); font-size: 17px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0.02em; }
.info-name { fill: var(--text); font-family: var(--sans); font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
.info-line { fill: var(--text-mute); font-family: var(--sans); font-size: 13px; text-anchor: middle; dominant-baseline: middle; }
.info-dim { fill: var(--text-dim); font-family: var(--sans); font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
.pill { fill: var(--iron-deep); stroke: var(--line); stroke-width: 1; }
.pill-text { fill: var(--text); font-family: var(--sans); font-size: 16px; text-anchor: middle; dominant-baseline: middle; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';

  var root = document.getElementById('root');
  var lastKey = '';
  var lastState = null;

  // DOM half-ring constants (design units, viewBox -440..440)
  var R_INNER = 88, R_OUTER = 190, R_CIN = 202, R_COUT = 282, H_CX = 12, GAP = 0.012;
  var TOP = -Math.PI / 2, BOT = Math.PI / 2;
  var CX_TXT = 150; // horizontal centre of the two rings, used for the text rows
  var RING = 282;   // pointer unit radius 1 == RING design units (matches the SKSE plugin hit test)

  function f(n) { return Math.round(n * 100) / 100; }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function hp(r, a) { return [H_CX + r * Math.cos(a), r * Math.sin(a)]; }
  function P(p) { return f(p[0]) + ' ' + f(p[1]); }
  function sector(ri, ro, a0, a1) {
    var i0 = hp(ri, a0), i1 = hp(ri, a1), o1 = hp(ro, a1), o0 = hp(ro, a0);
    return 'M ' + P(i0) + ' A ' + ri + ' ' + ri + ' 0 0 1 ' + P(i1) + ' L ' + P(o1) + ' A ' + ro + ' ' + ro + ' 0 0 0 ' + P(o0) + ' Z';
  }
  function arc(r, a0, a1) {
    var p0 = hp(r, a0), p1 = hp(r, a1);
    return 'M ' + P(p0) + ' A ' + r + ' ' + r + ' 0 0 1 ' + P(p1);
  }

  // text width budget: Latin = 1 unit (about 7px), CJK = 2 units
  function units(s) {
    var u = 0;
    for (var i = 0; i < s.length; i++) u += s.charCodeAt(i) >= 0x2E80 ? 2 : 1;
    return u;
  }
  function cut(s, max) {
    s = String(s);
    var out = '', u = 0;
    for (var i = 0; i < s.length; i++) {
      var w = s.charCodeAt(i) >= 0x2E80 ? 2 : 1;
      if (u + w > max - 1) return out + '\u2026';
      out += s.charAt(i); u += w;
    }
    return out;
  }
  // Same two-line wrapping as the DOM wedge label (dy -7 / +14).
  function labelSvg(text, x, y, maxU, cls) {
    text = String(text || '');
    var head = '<text class="' + cls + '" x="' + f(x) + '" y="' + f(y) + '">';
    if (units(text) <= maxU) return head + esc(text) + '</text>';
    var words = text.split(/\s+/), l1 = '', l2 = '', i = 0;
    while (i < words.length) {
      var trial = l1 ? l1 + ' ' + words[i] : words[i];
      if (units(trial) > maxU && l1) break;
      l1 = trial; i++;
    }
    if (units(l1) > maxU) { l1 = cut(l1, maxU); i = words.length; }
    if (i < words.length) {
      l2 = words.slice(i).join(' ');
      if (units(l2) > maxU) l2 = cut(l2, maxU);
    }
    var out = head + '<tspan x="' + f(x) + '" dy="' + (l2 ? '-7' : '0') + '">' + esc(l1) + '</tspan>';
    if (l2) out += '<tspan x="' + f(x) + '" dy="14">' + esc(l2) + '</tspan>';
    return out + '</text>';
  }

  // Line icons drawn in a +-14 box.
  var ICONS = {
    sword: '<path d="M-4 4 L11 -11 M-9 -1 L1 9 M-6.5 6.5 L-11 11"/>',
    dagger: '<path d="M-2 2 L9 -9 M-6 -2 L2 6 M-4 4 L-9 9"/>',
    axe: '<path d="M-9 11 L8 -8 M2 -12 Q13 -8 9 3 L3 -3 Z"/>',
    mace: '<path d="M-9 11 L1 1"/><circle cx="5" cy="-5" r="6"/>',
    bow: '<path d="M-5 -12 Q11 0 -5 12 Z M-10 0 L9 0"/>',
    staff: '<path d="M-9 12 L7 -6"/><circle cx="9" cy="-9" r="3.5"/>',
    arrow: '<path d="M-11 11 L9 -9 M9 -9 L3 -9 M9 -9 L9 -3 M-11 11 L-11 6 M-11 11 L-6 11"/>',
    armor: '<path d="M-10 -8 L-4 -11 L4 -11 L10 -8 L7 -2 L7 10 L-7 10 L-7 -2 Z"/>',
    helmet: '<path d="M-9 6 L-9 -2 Q-9 -10 0 -10 Q9 -10 9 -2 L9 6 L4 6 L4 1 L-4 1 L-4 6 Z"/>',
    shield: '<path d="M-8 -9 L8 -9 L8 1 Q8 8 0 12 Q-8 8 -8 1 Z"/>',
    ring: '<circle cx="0" cy="3" r="7"/><path d="M-3 -6 L0 -11 L3 -6 Z"/>',
    amulet: '<path d="M-8 -10 Q0 4 8 -10"/><circle cx="0" cy="6" r="5"/>',
    potion: '<path d="M-3 -11 L3 -11 M-2 -11 L-2 -4 L-8 6 Q-9 11 -4 11 L4 11 Q9 11 8 6 L2 -4 L2 -11 M-6 4 L6 4"/>',
    food: '<circle cx="0" cy="3" r="8"/><path d="M0 -5 Q0 -9 4 -11"/>',
    magic: '<path d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>',
    scroll: '<path d="M-8 -9 L8 -9 L8 9 L-8 9 Z M-4 -4 L4 -4 M-4 0 L4 0 M-4 4 L2 4"/>',
    torch: '<path d="M-2 12 L-2 0 L2 0 L2 12 M-5 0 Q0 -14 5 0 Z"/>',
    shout: '<path d="M-6 -8 Q0 0 -6 8 M-1 -10 Q7 0 -1 10 M4 -12 Q13 0 4 12"/>',
    back: '<path d="M8 -8 L-6 0 L8 8"/>',
    bag: '<path d="M-6 -6 Q-6 -12 0 -12 Q6 -12 6 -6 M-8 -6 L8 -6 L9 11 L-9 11 Z M-4 2 L4 2"/>',
    other: '<rect x="-8" y="-8" width="16" height="16" rx="3"/><path d="M0 -4 L4 0 L0 4 L-4 0 Z"/>'
  };
  function icon(name, x, y, px, cls, grow) {
    var sc = (px / 28) * (grow ? 1.12 : 1);
    return '<g class="icon ' + cls + '" transform="translate(' + f(x) + ' ' + f(y) + ') scale(' + f(sc) + ')">' +
           (ICONS[name] || ICONS.other) + '</g>';
  }

  function build(s) {
    var body = '';
    var i;
    var n = s.groups.length;
    var gi = s.gi;

    // Inner ring: groups
    if (n > 0) {
      var step = (BOT - TOP) / n;
      var halfStep = step / 2 - GAP;
      var maxU = Math.max(4, Math.min(14, Math.floor(step * (R_OUTER - 28) / 7)));
      for (i = 0; i < n; i++) {
        var g = s.groups[i];
        var a = TOP + (i + 0.5) * step;
        var active = i === gi;
        body += '<path class="wedge' + (active ? ' active' : '') + '" d="' + sector(R_INNER, R_OUTER, a - halfStep, a + halfStep) + '"/>';
        // icon on the left, one or two label lines to its right (e.g. potions above, food below)
        var gc = hp(134, a);
        var lines = (g.ls && g.ls.length) ? g.ls : [g.n];
        body += icon(g.ic, gc[0] - 42, gc[1], 26, active ? 'active' : '', active);
        for (var li = 0; li < lines.length; li++) {
          var ly = gc[1] + (lines.length === 1 ? 0 : (li === 0 ? -9 : 9));
          body += '<text class="wedge-label left' + (active ? ' active' : '') + '" x="' + f(gc[0] - 22) + '" y="' + f(ly) + '">' + esc(cut(lines[li], 12)) + '</text>';
        }
      }
      body += '<path class="h-centerline" d="' + arc((R_INNER + R_OUTER) / 2, TOP, BOT) + '"/>';

      // Outer ring: the whole right half split evenly between the items of the current page
      var count = s.items.length;
      if (count > 0) {
        var cstep = (BOT - TOP) / count;
        var chalf = cstep / 2 - 0.014;
        var cmaxU = Math.max(6, Math.min(22, Math.floor(cstep * 262 / 7)));
        for (i = 0; i < count; i++) {
          var item = s.items[i];
          var ca = TOP + (i + 0.5) * cstep;
          var hover = i === s.sel;
          var muted = !item.us;
          body += '<path class="wedge' + (muted ? ' off' : '') + (hover ? ' active' : '') + '" d="' + sector(R_CIN, R_COUT, ca - chalf, ca + chalf) + '"/>';
          var ip = hp(236, ca), lp = hp(266, ca);
          body += icon(item.ic, ip[0], ip[1], 24, (muted ? 'muted' : '') + (hover ? ' active' : ''), hover);
          body += labelSvg(item.n, lp[0], lp[1], cmaxU, 'wedge-label' + (muted ? ' muted' : '') + (hover ? ' active' : ''));
          if (item.eq) {
            body += '<path d="' + arc(R_COUT - 5, ca - chalf + 0.04, ca + chalf - 0.04) + '" fill="none" stroke="#c8791f" stroke-width="2.5" stroke-linecap="round"/>';
          }
          // stack size from the state text ("x5" or "x5 \u00B7 Equipped"); single items show nothing
          var cm = /^x(\d+)/.exec(item.st || '');
          var cnt = cm ? parseInt(cm[1], 10) : 0;
          var hasCnt = cnt > 1;
          if (item.qs > 0) {
            var bp = hp(213, ca - (hasCnt ? 0.075 : 0));
            body += '<circle class="badge" cx="' + f(bp[0]) + '" cy="' + f(bp[1]) + '" r="8"/>' +
                    '<text class="badge-n" x="' + f(bp[0]) + '" y="' + f(bp[1]) + '">' + item.qs + '</text>';
          }
          if (hasCnt) {
            var cp = hp(213, ca + (item.qs > 0 ? 0.065 : 0));
            body += '<text class="count' + (hover ? ' active' : '') + '" x="' + f(cp[0]) + '" y="' + f(cp[1]) + '">\u00D7' + (cnt > 999 ? '999+' : cnt) + '</text>';
          }
        }
      }
    }

    // Text rows (not part of the DOM wheel; needed for the group title, selection and pages)
    body += '<text class="title" x="' + CX_TXT + '" y="-322">' + esc(s.title || '') + '</text>';
    var c = s.centre;
    if (c) {
      body += '<text class="info-name" x="' + CX_TXT + '" y="316">' + esc(cut(c.n, 44)) + '</text>';
      body += '<text class="info-line" x="' + CX_TXT + '" y="338">' + esc(cut(c.info || '', 64)) + '</text>';
    } else {
      body += '<text class="info-line" x="' + CX_TXT + '" y="316">' + esc(cut(s.idle || '', 64)) + '</text>';
    }
    var foot = s.count;
    if (s.pages && s.pages.total > 1) foot += '  \u00B7  ' + (s.pages.cur + 1) + ' / ' + s.pages.total;
    body += '<text class="info-dim" x="' + CX_TXT + '" y="364">' + esc(foot) + '</text>';
    if (s.cfg.hints && s.hints) {
      for (i = 0; i < s.hints.length; i++) {
        body += '<text class="info-dim" x="' + CX_TXT + '" y="' + (388 + i * 18) + '">' + esc(cut(s.hints[i], 90)) + '</text>';
      }
    }
    return body;
  }

  function render(s) {
    var W = window.innerWidth || 1920;
    var H = window.innerHeight || 1080;
    var S = Math.min(0.92 * Math.min(W, H), 820);
    var key = JSON.stringify([s.panel, s.message, s.title, s.groups, s.gi, s.pages, s.count, s.items, s.centre, s.idle, s.hints, s.sel, s.cfg, W, H]);
    if (key !== lastKey) {
      lastKey = key;
      var body;
      if (s.panel) {
        body = '<rect class="pill" x="-300" y="-40" width="600" height="80" rx="10"/>' +
               '<text class="pill-text" x="0" y="0">' + esc(s.message || '') + '</text>';
      } else {
        body = build(s);
      }
      var vignette = (s.cfg.overlay > 0) ? '<div id="vignette"></div>' : '';
      root.innerHTML = vignette +
        '<div id="stage" style="left:' + f((W - S) / 2) + 'px;top:' + f((H - S) / 2) + 'px;width:' + f(S) + 'px;height:' + f(S) + 'px">' +
        '<svg id="halfring" xmlns="http://www.w3.org/2000/svg" width="' + f(S) + '" height="' + f(S) + '" viewBox="-440 -440 880 880">' +
        body + '<g id="ptr"></g></svg></div>';
    }
    var ptr = document.getElementById('ptr');
    if (ptr && !s.panel) {
      var px = H_CX + s.x * RING, py = s.y * RING;
      ptr.innerHTML = '<circle cx="' + f(px) + '" cy="' + f(py) + '" r="4" fill="#e8932a"/>' +
                      '<circle cx="' + f(px) + '" cy="' + f(py) + '" r="7" fill="none" stroke="rgba(0,0,0,0.82)" stroke-width="2"/>';
    }
  }

  // Entry point called by the SKSE plugin (Wheel state as JSON).
  window.fwUpdate = function (json) {
    var s;
    try { s = JSON.parse(json); } catch (e) { return; }
    if (!s || !s.open) {
      lastKey = '';
      lastState = null;
      root.innerHTML = '';
      return;
    }
    lastState = s;
    try { render(s); } catch (e) { root.innerHTML = ''; lastKey = ''; }
  };

  window.addEventListener('resize', function () {
    if (lastState) { lastKey = ''; try { render(lastState); } catch (e) {} }
  });
})();
</script>
</body>
</html>
